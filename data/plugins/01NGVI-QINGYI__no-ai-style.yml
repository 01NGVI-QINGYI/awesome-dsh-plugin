name: 01NGVI-QINGYI/no-ai-style
category: skill
description:
  en: 'Prose-editing skill for academic and professional writing, with a composer entry: the skill removes mechanical AI phrasing, defensive hedging and filler while preserving claims, citations, statistics, methods and limitations, and the composer button inserts one of its three modes (check, polish, draft) into the input box in the interface language (zh / en / ja).'
  zh: '面向学术与专业写作的润色技能，并提供输入框入口：技能去除机械化的 AI 表达、防御性铺垫与空话，同时保留主张、引用、统计、方法与局限性；输入框按钮按界面语言（中 / 英 / 日）插入检查、润色、起草三种模式之一。'
